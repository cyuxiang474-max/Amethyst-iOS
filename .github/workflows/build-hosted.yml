name: Build IPA (GitHub-hosted macOS)

# The upstream development.yml runs on a self-hosted runner (J316sAP) that only
# exists on the maintainer's machine, so a fork's push would queue forever with
# "no runner matching labels". This workflow is a drop-in replacement that uses
# GitHub-hosted macOS runners so a fork can actually build an IPA.
#
# Provenance: every build step below is invoked from the repository's own
# Makefile; nothing about how Amethyst is compiled is changed here. The only
# additions are toolchain setup (ldid is not preinstalled) and a JDK 8 fallback.

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'build/**'
    paths-ignore:
      - 'l10n_main'

jobs:
  build:
    name: Build IPA
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 2
            platform_name: ios

    # Two independent constraints force this label, and neither is negotiable:
    #
    # 1. Intel, not Apple Silicon. JDK 8 has no arm64 macOS build from any
    #    vendor, so the Temurin 8 cask installs an x86_64 JDK. On an arm64
    #    runner its `javac` aborts with "Bad CPU type in executable" unless
    #    Rosetta 2 is present, and `javac -version` then prints nothing, which
    #    the Makefile's 1.8.0 check reads as "no JDK installed".
    #
    # 2. macOS 26, i.e. an iOS 26 SDK. LauncherProfilesViewController.m:80 calls
    #    UIBarButtonItem.sharesBackground, which is public API only in the iOS 26
    #    SDK. Built against the iOS 18 SDK that ships with macos-15, that file
    #    fails with "property 'sharesBackground' not found on object of type
    #    'UIBarButtonItem *'".
    #
    # xcode-27 would give a newer SDK still, but it is arm64-only and a public
    # preview, so it would reintroduce constraint 1.
    runs-on: macos-26-intel
    timeout-minutes: 360

    steps:
      - name: Show runner info
        run: |
          echo "runner: $RUNNER_NAME ($RUNNER_ARCH)"
          sw_vers
          xcodebuild -version
          cmake --version | head -1
          /usr/libexec/java_home -V 2>&1 || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          # Deliberately no `set -e` here: we want every missing tool reported in
          # a single run instead of aborting on the first brew failure.
          set -uo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # ldid is required by the Makefile 'payload' target to ad-hoc sign the
          # app bundle. gmake is required because the Makefile declares
          # `SHELL := /bin/bash` and uses GNU-only constructs (pattern rules,
          # $(shell), .SUFFIXES); BSD make on macOS cannot build it. Neither is
          # present on GitHub-hosted runners.
          #
          # Homebrew refuses to auto-install the diskcatalogmaker cask that the
          # ldid formula depends on, so it has to be installed explicitly first,
          # otherwise `brew install ldid` aborts the job.
          brew install --cask diskcatalogmaker || echo "WARN: diskcatalogmaker cask failed"

          # NOTE: there is no `gmake` formula. Homebrew's GNU make formula is
          # called `make`, and because macOS already ships /usr/bin/make the
          # formula installs its binary as `gmake`. Asking brew for `gmake`
          # directly fails with "No available formula with the name gmake".
          brew install make || echo "WARN: brew make failed"

          # Safety net: macOS ships GNU Make 3.81 as /usr/bin/make. This Makefile
          # uses no GNU Make 4.x-only constructs (no .ONESHELL, no $(file ...),
          # no != shell assignment), so 3.81 is an acceptable substitute.
          if ! command -v gmake >/dev/null 2>&1; then
            if /usr/bin/make --version 2>/dev/null | head -1 | grep -qi 'GNU Make'; then
              ln -sf /usr/bin/make /usr/local/bin/gmake
              echo "fallback: linked /usr/bin/make as gmake"
            fi
          fi

          brew install ldid || echo "WARN: ldid failed"

          # ------------------------------------------------------------------
          # JDK 8
          #
          # The Makefile hard-requires a javac reporting exactly 1.8.0
          # (Makefile:190 errors out otherwise; Makefile:194 filters
          # `javac -version | cut -b 7-11` against the literal 1.8.0), and
          # JavaApp/Makefile calls `$(BOOTJDK)/javac` with no -source/-target, so
          # the emitted class file version simply follows whichever JDK is used.
          # A newer JDK would write major-version 65 class files that the bundled
          # Zulu 8 JRE cannot load. JDK 8 is mandatory, not cosmetic.
          #
          # Install it up front instead of probing first: the runner's own JDKs
          # are 11/17/21/25, so the probe can only ever fail on a fresh runner
          # and would just cost a `java_home -V` round trip.
          # ------------------------------------------------------------------
          echo "host arch: $(uname -m)"
          brew install --cask temurin@8 || echo "WARN: temurin@8 cask failed"

          JDK8_HOME=""
          # Do NOT parse `java_home -V` for the JDK list. Its version table is
          # written to stderr and is space-separated, not tab-separated, so both
          # earlier parsers (sed 's/.*- \(.*\)/\1/p' and awk -F'\t' 'NF>1')
          # silently produced an empty list and the step fell through to the
          # Temurin branch with no candidate ever tested.
          #
          # Ask java_home directly for 1.8, and also glob the directory the
          # cask's pkg installer registers, so either mechanism resolving is
          # enough.
          candidates="$(/usr/libexec/java_home -v 1.8 2>/dev/null || true)"
          candidates="$candidates $(ls -d /Library/Java/JavaVirtualMachines/*/Contents/Home 2>/dev/null || true)"

          for candidate in $candidates; do
            [ -x "$candidate/bin/javac" ] || continue
            rawver="$("$candidate/bin/javac" -version 2>&1 | head -1)"
            reported="$(printf '%s' "$rawver" | cut -b 7-11)"
            echo "candidate: $candidate -> [$(file -b "$candidate/bin/javac" 2>/dev/null)] ${rawver:-<javac produced no output>}"
            if [ "$reported" = "1.8.0" ]; then JDK8_HOME="$candidate"; break; fi
          done

          if [ -z "$JDK8_HOME" ]; then
            echo "FATAL: could not obtain a JDK reporting 1.8.0" >&2
            echo "--- java_home -V raw output ---" >&2
            /usr/libexec/java_home -V >&2 || true
            echo "--- candidates probed ---" >&2
            for candidate in $candidates; do echo "  $candidate" >&2; done
            exit 1
          fi

          echo "JDK8_HOME=$JDK8_HOME"
          "$JDK8_HOME/bin/javac" -version
          "$JDK8_HOME/bin/jar" --version 2>&1 | head -1 || true
          echo "JDK8_HOME=$JDK8_HOME" >> "$GITHUB_ENV"

          # Report every missing tool at once rather than dying later in the build.
          missing=()
          for tool in gmake cmake ldid zip unzip xcrun; do
            command -v "$tool" >/dev/null 2>&1 && echo "ok: $tool -> $(command -v "$tool")" || missing+=("$tool")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "MISSING REQUIRED TOOLS: ${missing[*]}" >&2
            exit 1
          fi

          # ldid declares the diskcatalogmaker cask as a dependency, and that
          # cask currently fails with a SHA-256 mismatch because the vendor
          # re-published its zip without updating the cask hash. ldid's own -S/-M
          # paths do not shell out to it, but if that assumption were ever wrong
          # we would not find out until the 'payload' target, twenty minutes into
          # the build. Execute ldid once now: usage text proves it runs.
          ldid_out="$(ldid 2>&1 | head -3 || true)"
          if [ -z "$ldid_out" ]; then
            echo "FATAL: ldid is on PATH but produced no output" >&2
            exit 1
          fi
          echo "ldid smoke test:"
          printf '%s\n' "$ldid_out"

          gmake --version | head -1

      - name: Cache CMake build and JREs
        uses: actions/cache@v4
        with:
          path: |
            Natives/build
            depends
          key: amethyst-hosted-${{ runner.os }}-${{ hashFiles('Makefile', 'Natives/CMakeLists.txt', 'Natives/external/**/CMakeLists.txt') }}
          restore-keys: |
            amethyst-hosted-${{ runner.os }}-

      - name: Build ipa
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export SLIMMED=1
          echo "gmake: $(command -v gmake)"
          echo "BOOTJDK: $JDK8_HOME/bin"
          # Pass BOOTJDK explicitly. The Makefile only uses `?=` for it
          # (Makefile:59), so an environment-provided value would silently win
          # and the 1.8.0 check would then fail against the wrong JDK.
          gmake -j"$(sysctl -n hw.ncpu)" dsym package \
            PLATFORM=${{ matrix.platform }} \
            BOOTJDK="$JDK8_HOME/bin"

      - name: Verify artifact
        run: |
          set -euo pipefail
          ls -lh artifacts/
          # Both the regular and the slimmed IPA are produced when SLIMMED=1,
          # so match with ls rather than a shell glob (a multi-match glob would
          # make `test -f` fail on argument count).
          ls artifacts/ | grep -E '^org\.angelauramc\.amethyst.*-ios\.ipa$'
          for ipa in artifacts/org.angelauramc.amethyst*-ios.ipa; do
            echo "--- $ipa ---"
            unzip -l "$ipa" | grep -q 'Payload/AngelAuraAmethyst.app/Info.plist' \
              || { echo "MISSING Info.plist in $ipa"; exit 1; }
            unzip -l "$ipa" | grep -q 'AngelAuraAmethyst.app/AngelAuraAmethyst' \
              || { echo "MISSING main binary in $ipa"; exit 1; }
            echo "ok"
          done

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: ignore
